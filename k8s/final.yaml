# -------------------
# 1. Prometheus Configuration
# -------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s 
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      # THIS IS THE CONNECTION TO YOUR APP
      - job_name: 'todo-app'
        metrics_path: /metrics  # Standard path, change if your app uses a different one
        static_configs:
          - targets: ['todo-app-service:8000']

---
# -------------------
# 2. Prometheus Deployment
# -------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus/
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config

---
# -------------------
# 3. Prometheus Service (NodePort)
# -------------------
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
spec:
  selector:
    app: prometheus
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090

---
# -------------------
# 4. Todo App Service (The Bridge)
# -------------------
apiVersion: v1
kind: Service
metadata:
  name: todo-app-service
  labels:
    app: todo-app
spec:
  selector:
    app: todo-app
  type: NodePort
  ports:
    - protocol: TCP
      port: 8000        # The port Prometheus looks for
      targetPort: 8000  # The port your container exposes
      nodePort: 30080  # Optional: Expose it via NodePort

---
# -------------------
# 5. Todo App Deployment (Your Code)
# -------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-deployment
  labels:
    app: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
      - name: todo-app
        image: dhia2001/simple-todo-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: PROMETHEUS_MULTIPROC_DIR
          value: "/tmp"